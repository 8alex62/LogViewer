# cargo-deny policy for the Core workspace: `cargo deny check` from core/.
# Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
# Check the dependencies of every target the Core ships to (desktop and web),
# with all features on.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "wasm32-unknown-unknown",
]
all-features = true

[advisories]
# Any crate with a RustSec advisory (vulnerability, unsound, unmaintained) fails.
# Add an id to `ignore` only with the reason and a link to the tracking issue.
ignore = []

[licenses]
# Licenses compatible with the project license (Apache-2.0): permissive ones
# only, no copyleft.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.9
# The list covers dependencies to come; do not warn about licenses no crate
# uses yet.
unused-allowed-license = "allow"

[licenses.private]
# Workspace crates are not published (`publish = false`) and use license-file.
ignore = true

[bans]
# Two versions of the same crate in the graph: warn rather than fail, the
# ecosystem cannot always avoid it. Add a `skip` entry once a duplicate is
# known and accepted.
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies have no version requirement.
allow-wildcard-paths = true

[sources]
# Only crates.io; no git or alternative registries.
unknown-registry = "deny"
unknown-git = "deny"
