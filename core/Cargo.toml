[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license-file = "../LICENSE"
repository = "https://github.com/8alex62/LogViewer"
publish = false

# Internal crates (Clean Architecture layers, see docs/architecture.md) and the
# third-party versions shared across the workspace. Crates opt in with
# `<name>.workspace = true`.
[workspace.dependencies]
logviewer-domain = { path = "crates/logviewer-domain" }
logviewer-application = { path = "crates/logviewer-application" }
logviewer-infrastructure = { path = "crates/logviewer-infrastructure", default-features = false }

thiserror = "2"
wasm-bindgen = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that are more noise than signal for this project.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
# Restriction lints we opt into.
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
