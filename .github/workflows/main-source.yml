# main only receives releases from develop (see CONTRIBUTING.md).
# This check is required on main by a repository ruleset, so a pull request
# from any other branch cannot be merged into main.
name: Main source branch

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  only-develop:
    name: Only develop into main
    runs-on: ubuntu-latest
    steps:
      - name: Check the source branch
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ] || [ "$HEAD_REF" != "develop" ]; then
            echo "::error::Pull requests into main must come from develop of $GITHUB_REPOSITORY (got $HEAD_REPO:$HEAD_REF)."
            exit 1
          fi
          echo "Source branch is develop."
