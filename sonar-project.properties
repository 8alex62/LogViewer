# SonarCloud analysis, run from CI (.github/workflows/core.yml, job "coverage").
# Automatic Analysis must be turned off in the SonarCloud project settings:
# it cannot import coverage reports.
sonar.organization=8alex62
sonar.projectKey=8alex62_LogViewer
sonar.projectName=LogViewer

# The scanner analyzes the whole repository and splits the Cargo workspace
# into one module per crate. Integration tests in each crate's tests/ folder
# are kept out of the source analysis.
sonar.exclusions=**/target/**,core/crates/*/tests/**

# The coverage report path (core/lcov.info, produced by `cargo llvm-cov`) is
# passed as an absolute path by the CI, see the "SonarCloud scan" step.
sonar.rust.cargo.manifestPaths=core/Cargo.toml
